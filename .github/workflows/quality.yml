name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile first-party Python sources
        run: python -m compileall -q -x '(^|/)repos/' .
